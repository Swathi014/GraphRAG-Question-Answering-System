<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrivGraphAI — Local Control Panel</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔒</text></svg>">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">◆</span>
    <div>
      <h1>PrivGraphAI</h1>
      <p class="subtitle">On-Device Agentic GraphRAG — Local Control Panel</p>
    </div>
  </div>
  <div class="offline-pill" title="This page loads no external resources and makes no network calls beyond your own machine.">
    <span class="dot"></span> 100% local — no internet used
  </div>
</header>

<main>
  <section class="status-bar">
    <div class="status-left">
      <span class="status-label">Status:</span>
      <span id="status-badge" class="badge badge-idle">Idle</span>
      <span id="status-detail" class="status-detail"></span>
    </div>
    <button id="stop-btn" class="btn btn-danger" disabled>■ Stop</button>
  </section>

  <section class="panel">
    <div class="tabs">
      <button class="tab-btn active" data-tab="ingest">Ingest a document</button>
      <button class="tab-btn" data-tab="ask">Ask a question</button>
    </div>

    <div id="tab-ingest" class="tab-content active">
      <div class="field-group">
        <label class="field-label">Source PDF</label>
        <div class="source-toggle">
          <label><input type="radio" name="source-mode" value="upload" checked> Upload from browser</label>
          <label><input type="radio" name="source-mode" value="path"> Use existing path on this machine</label>
        </div>
        <div id="upload-row" class="row">
          <input type="file" id="pdf-file" accept="application/pdf">
        </div>
        <div id="path-row" class="row hidden">
          <input type="text" id="pdf-path" placeholder="D:\path\to\document.pdf">
          <button class="btn btn-secondary" data-browse-target="pdf-path" data-browse-files="true">Browse…</button>
        </div>
      </div>

      <div class="field-row">
        <div class="field-group">
          <label class="field-label" for="ingest-graph">Save graph to</label>
          <input type="text" id="ingest-graph" value="graph.json">
        </div>
        <div class="field-group">
          <label class="field-label" for="ingest-elements">Save elements to</label>
          <input type="text" id="ingest-elements" value="elements.json">
        </div>
      </div>

      <div class="field-row field-row-end">
        <label class="checkbox-label"><input type="checkbox" id="ingest-verbose"> Verbose (-v)</label>
        <button id="run-ingest" class="btn btn-primary">▶ Run Ingest</button>
      </div>

      <p class="hint">First run is slow (Docling + model loading). Large PDFs can take minutes to hours on CPU-only hardware — this is expected, not a failure.</p>
    </div>

    <div id="tab-ask" class="tab-content">
      <div class="field-group">
        <label class="field-label" for="ask-question">Question</label>
        <input type="text" id="ask-question" placeholder="What problem does PrivGraphAI address?">
      </div>

      <div class="field-row">
        <div class="field-group">
          <label class="field-label" for="ask-graph">Graph file</label>
          <div class="row">
            <input type="text" id="ask-graph" value="graph.json">
            <button class="btn btn-secondary" data-browse-target="ask-graph" data-browse-files="true">Browse…</button>
          </div>
        </div>
        <div class="field-group">
          <label class="field-label" for="ask-elements">Elements file</label>
          <div class="row">
            <input type="text" id="ask-elements" value="elements.json">
            <button class="btn btn-secondary" data-browse-target="ask-elements" data-browse-files="true">Browse…</button>
          </div>
        </div>
      </div>

      <div class="field-row field-row-end">
        <label class="checkbox-label"><input type="checkbox" id="ask-verbose"> Verbose (-v)</label>
        <button id="run-ask" class="btn btn-primary">▶ Run Ask</button>
      </div>
    </div>
  </section>

  <section class="panel log-panel">
    <div class="log-header">
      <h2>Output</h2>
      <button id="clear-log" class="btn btn-ghost">Clear</button>
    </div>
    <pre id="log-console" class="log-console"></pre>
  </section>
</main>

<div id="browse-modal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-header">
      <span id="browse-path" class="browse-path"></span>
      <button id="browse-close" class="btn btn-ghost">✕</button>
    </div>
    <div id="browse-list" class="browse-list"></div>
  </div>
</div>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
